<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="40" text-anchor="middle" fill="#e0e0e0" font-family="Menlo,monospace" font-size="18" font-weight="bold">会话名称修改 · 效果演示</text>

  <!-- Before Window -->
  <rect x="30" y="65" width="355" height="200" rx="8" fill="#2d2d44" filter="url(#shadow)"/>
  <rect x="30" y="65" width="355" height="28" rx="8" fill="#3d3d54"/>
  <rect x="30" y="85" width="355" height="8" fill="#3d3d54"/>
  <text x="48" y="84" fill="#ff6b6b" font-family="Menlo,monospace" font-size="11">● ● ●</text>
  <circle cx="48" cy="79" r="5" fill="#ff5f57"/>
  <circle cx="66" cy="79" r="5" fill="#ffbd2e"/>
  <circle cx="84" cy="79" r="5" fill="#28ca41"/>
  <text x="207" y="83" fill="#999" font-family="Menlo,monospace" font-size="10" text-anchor="middle">修改前</text>

  <text x="48" y="115" fill="#aaa" font-family="Menlo,monospace" font-size="10">$ sessions_list</text>
  <text x="48" y="137" fill="#888" font-family="Menlo,monospace" font-size="10">┌─────────┬──────────────────────────────────┐</text>
  <text x="48" y="155" fill="#ff6b6b" font-family="Menlo,monospace" font-size="10">│ display │ "[Sun 2026-05-24 12:54 GMT+8]  │</text>
  <text x="48" y="173" fill="#ff6b6b" font-family="Menlo,monospace" font-size="10">│  Name   │  这个对话是watchdose项目的..."   │</text>
  <text x="48" y="191" fill="#888" font-family="Menlo,monospace" font-size="10">└─────────┴──────────────────────────────────┘</text>
  <text x="48" y="215" fill="#ff6b6b" font-family="Menlo,monospace" font-size="10">❌ 无法辨识，标题自动截断</text>

  <!-- Arrow -->
  <text x="400" y="170" text-anchor="middle" fill="#28ca41" font-family="Menlo,monospace" font-size="24">→</text>

  <!-- After Window -->
  <rect x="415" y="65" width="355" height="200" rx="8" fill="#2d2d44" filter="url(#shadow)"/>
  <rect x="415" y="65" width="355" height="28" rx="8" fill="#3d3d54"/>
  <rect x="415" y="85" width="355" height="8" fill="#3d3d54"/>
  <text x="433" y="84" fill="#ff6b6b" font-family="Menlo,monospace" font-size="11">● ● ●</text>
  <circle cx="433" cy="79" r="5" fill="#ff5f57"/>
  <circle cx="451" cy="79" r="5" fill="#ffbd2e"/>
  <circle cx="469" cy="79" r="5" fill="#28ca41"/>
  <text x="592" y="83" fill="#999" font-family="Menlo,monospace" font-size="10" text-anchor="middle">修改后</text>

  <text x="433" y="115" fill="#aaa" font-family="Menlo,monospace" font-size="10">$ python3 -c "..."  # 写入 label</text>
  <text x="433" y="137" fill="#888" font-family="Menlo,monospace" font-size="10">┌─────────┬──────────────────────────────────┐</text>
  <text x="433" y="155" fill="#28ca41" font-family="Menlo,monospace" font-size="10">│ display │ WatchDose · 吃药提醒             │</text>
  <text x="433" y="173" fill="#28ca41" font-family="Menlo,monospace" font-size="10">│  Name   │                                  │</text>
  <text x="433" y="191" fill="#888" font-family="Menlo,monospace" font-size="10">└─────────┴──────────────────────────────────┘</text>
  <text x="433" y="215" fill="#28ca41" font-family="Menlo,monospace" font-size="10">✅ 名称清晰可辨识</text>

  <!-- How it works -->
  <text x="400" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Menlo,monospace" font-size="14" font-weight="bold">原理</text>
  <rect x="130" y="320" width="540" height="140" rx="6" fill="#2d2d44" filter="url(#shadow)"/>
  <text x="150" y="343" fill="#888" font-family="Menlo,monospace" font-size="10">// ~/.openclaw/agents/main/sessions/sessions.json</text>
  <text x="150" y="363" fill="#aaa" font-family="Menlo,monospace" font-size="10">{</text>
  <text x="170" y="383" fill="#aaa" font-family="Menlo,monospace" font-size="10">  "agent:main:main": {</text>
  <text x="190" y="403" fill="#aaa" font-family="Menlo,monospace" font-size="10">    "sessionId": "1311a7de-...",</text>
  <text x="190" y="423" fill="#f0e68c" font-family="Menlo,monospace" font-size="10">    "label": "WatchDose · 吃药提醒"  // ← 加这一行</text>
  <text x="170" y="443" fill="#aaa" font-family="Menlo,monospace" font-size="10">  }</text>
  <text x="150" y="463" fill="#aaa" font-family="Menlo,monospace" font-size="10">}  </text>

  <!-- Footer -->
  <text x="400" y="490" text-anchor="middle" fill="#666" font-family="Menlo,monospace" font-size="10">clawhub install session-rename-zh  |  github.com/fhekg/openclaw-session-rename</text>
</svg>